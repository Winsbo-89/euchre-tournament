{{define "content"}}<div class="card center"><h1 id="tournament-name">{{if .Tournament}}{{.Tournament.Name}}{{else}}Euchre Tournament{{end}}</h1><p id="leaderboard-status" class="muted">Live leaderboard · updates automatically</p></div><div class="card"><div class="table-wrap"><table id="leaderboard"><thead><tr><th>Rank</th><th>Player</th><th>Games</th><th>Total</th><th>Average</th></tr></thead><tbody></tbody></table></div></div><script>async function refresh(){try{const r=await fetch('/api/leaderboard',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();document.getElementById('tournament-name').textContent=d.tournament_name||'Euchre Tournament';document.getElementById('leaderboard-status').textContent=d.completed?'Tournament complete':(d.current_game?'Game '+d.current_game+' · '+d.submitted_current_game+'/'+d.player_count+' scores submitted · auto-refreshing':'No active tournament');const b=document.querySelector('#leaderboard tbody');b.replaceChildren();d.players.forEach(p=>{const tr=document.createElement('tr');[p.rank,p.name,p.games_completed,p.total,p.average.toFixed(2)].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===1)td.style.fontWeight='700';tr.appendChild(td)});b.appendChild(tr)})}catch(e){document.getElementById('leaderboard-status').textContent='Waiting for server…'}}refresh();setInterval(refresh,10000);</script>{{end}}
