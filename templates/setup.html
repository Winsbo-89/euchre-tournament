{{define "content"}}<div class="card"><h1>First-time setup</h1><p>Create the permanent administrator account.</p><form method="post" action="/setup"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Admin username</label><input name="username" required minlength="3" maxlength="80" autocomplete="username"><label>Password (at least 10 characters recommended)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"><label>Confirm password</label><input type="password" name="confirm" required minlength="8" autocomplete="new-password"><div class="actions"><button>Create Admin Account</button></div></form></div>{{end}}
