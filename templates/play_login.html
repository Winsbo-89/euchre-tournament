{{define "content"}}<div class="card" style="max-width:520px;margin:auto"><h1>Player Login</h1>{{if .Tournament}}<p><strong>{{.Tournament.Name}}</strong></p>{{if eq .Tournament.Status "setup"}}<div class="notice">The organizer has not started the tournament yet.</div>{{else}}<form method="post" action="/play/login"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Your name</label><select name="player_id" required><option value="">Select your name</option>{{range .Players}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select><label>Your tournament PIN</label><input class="pin-input" type="password" name="pin" inputmode="numeric" autocomplete="one-time-code" required minlength="4" maxlength="12"><div class="actions"><button>Continue</button></div></form>{{end}}{{else}}<div class="notice warning">There is no tournament right now.</div>{{end}}</div>{{end}}
